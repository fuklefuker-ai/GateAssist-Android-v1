name: GateAssist Android v1 CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle lintDebug --stacktrace
      - name: Build installable APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GateAssist-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GateAssist-v1-APK
          path: GateAssist-v1.apk
          if-no-files-found: error

  emulator-smoke-test:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Emulator UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace
